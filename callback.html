<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logging in...</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .message {
      text-align: center;
      padding: 24px;
    }
    .error {
      color: #b00020;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="message" id="message">Completing login...</div>

  <script src="salesforce.js"></script>
  <script>
    try {
      window.SalesforceApi.handleCallback();
      window.location.href = "index.html";
    } catch (err) {
      const el = document.getElementById("message");
      el.textContent = "Login failed: " + err.message;
      el.className = "message error";
    }
  </script>
</body>
</html>
